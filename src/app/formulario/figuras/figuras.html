<div class="container">
  <div class="row pt-4">
    <div class="col-md-6">
      <form>
        <div class="mb-3">
          <label>Elige la figura:</label><br>
          <input type="radio" [(ngModel)]="figura" value="triangulo" name="figuraRadio"> Triangulo <br>
          <input type="radio" [(ngModel)]="figura" value="rectangulo" name="figuraRadio"> Rectangulo <br>
          <input type="radio" [(ngModel)]="figura" value="circulo" name="figuraRadio"> Circulo <br>
          <input type="radio" [(ngModel)]="figura" value="pentagono" name="figuraRadio"> Pentagono
        </div>

        <div class="form-group pt-2">
          <label>Numero 1:</label>
          <input [(ngModel)]="num1" name="num1" type="text" class="form-control">
        </div>

        <div class="form-group pt-2">
          <label>Numero 2:</label>
          <input [(ngModel)]="num2" name="num2" type="text" class="form-control">
        </div>
        
        <br>
        <button (click)="calcular()" type="button" class="btn btn-primary">
          Calcular area
        </button>
      </form>
    </div>
    
    <div class="col-md-6">
      <h3>Resultado: {{resultado}}</h3>
    </div>
  </div>
</div>
