<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <div class="container">
  <div class="row pt-4">
    <div class="col-md-6">
      <form>
        <h4>Punto A</h4>
        <div class="form-group pt-2">
          <label> X1:</label>
          <input [(ngModel)]="x1" name="x1" type="text" class="form-control">
        </div>
        <div class="form-group pt-2">
          <label>Y1:</label>
          <input [(ngModel)]="y1" name="y1" type="text" class="form-control">
        </div>

        <h4 class="pt-4">Punto B</h4>
        <div class="form-group pt-2">
          <label>X2:</label>
          <input [(ngModel)]="x2" name="x2" type="text" class="form-control">
        </div>
        <div class="form-group pt-2">
          <label> Y2:</label>
          <input [(ngModel)]="y2" name="y2" type="text" class="form-control">
        </div>
        
        <br>
        <button (click)="calcular()" type="button" class="btn btn-primary">
          Calcular distancia
        </button>
      </form>
    </div>
    
    <div class="col-md-6">
      <h3>Distancia: {{resultado}}</h3>
    </div>
  </div>
</div>
    
</body>
</html>
